name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0. Defaults to the tag name without v."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Resolve release version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${{ github.ref_name }}"
            else
              version="0.2.0"
            fi
          fi
          release_version="${version#v}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架旧版 tools 包；只安装仍受支持的 platform-tools。
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artifacts/qwen3-tts-android-${RELEASE_VERSION}-arm64-v8a.apk"
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-${{ env.RELEASE_VERSION }}
          path: artifacts/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Qwen3 中文语音 ${{ env.RELEASE_VERSION }}
          body: |
            本次构建的 Android ARM64 APK：

            - `qwen3-tts-android-${{ env.RELEASE_VERSION }}-arm64-v8a.apk`
          files: artifacts/*.apk
